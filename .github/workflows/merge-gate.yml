# merge-gate: hands-off merging for pull requests into main.
#
# What it does, in order:
# 1. Holds for the human owner any pull request that
#    - is marked [RED] in its title or description, or
#    - changes any path listed in .github/CODEOWNERS (read from main, never
#      from the pull request), or anything under .github/.
#    Those never merge automatically. If the gate cannot read CODEOWNERS or
#    the changed-file list, it holds the pull request (fails closed).
#    The one exception is a configured automation lane
#    (.github/automation-lanes.json on main, see docs/automation-lanes.md):
#    a pull request from the named automation account, on a feed/ branch
#    inside this repository, that changes only allowed files under data/.
#    [RED] pull requests, .github/ and CODEOWNERS are never in a lane.
# 2. Turns on auto-merge (squash) for pull requests from branches inside
#    this repository. Pull requests from forks are never auto-merged.
# 3. Waits until every other check on the pull request has finished and
#    fails if any of them failed.
#
# The organization ruleset on main requires this "merge-gate" check, so a
# pull request merges only when this job passes.
#
# Security note: this runs on pull_request_target, so GitHub always uses
# the copy of this file on main, never a copy edited inside a pull request.
# It never checks out or runs pull request code. The title and description
# are passed in as environment variables, never pasted into the script.

name: merge-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]

permissions: {}

concurrency:
  group: merge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    # Public repositories only; on private repositories this needs a paid
    # GitHub Advanced Security licence.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  merge-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      IS_DRAFT: ${{ github.event.pull_request.draft }}
    steps:
      - name: Hold [RED] pull requests and owner-only files
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          FEEDS_PAUSED: ${{ vars.FEEDS_PAUSED }}
        run: |
          # Any error in this step fails the step, which holds the pull request.
          set -euo pipefail

          # 1. Anything marked [RED] always needs the owner.
          if printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | grep -qF '[RED]'; then
            echo "::error::This pull request is marked [RED] and needs the owner to merge it."
            exit 1
          fi

          # 2. Owner-only paths come from CODEOWNERS on the base branch (main),
          #    so a pull request can never loosen its own rules.
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/$REPO/contents/.github/CODEOWNERS?ref=$BASE_REF" > "$RUNNER_TEMP/CODEOWNERS"

          gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/files.txt"
          if [ ! -s "$RUNNER_TEMP/files.txt" ]; then
            echo "::error::Could not read the list of changed files, so this pull request is held for the owner."
            exit 1
          fi

          # 3. Automation lanes (see docs/automation-lanes.md). The lane file is
          #    read from main, never from the pull request. If it is missing or
          #    unreadable, no lane applies and the owner rules stand.
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/$REPO/contents/.github/automation-lanes.json?ref=$BASE_REF" \
            > "$RUNNER_TEMP/lanes.json" 2>/dev/null || echo '{"enabled": false}' > "$RUNNER_TEMP/lanes.json"
          gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate \
            --jq '.[] | {filename, previous_filename, status, additions, deletions}' > "$RUNNER_TEMP/files.jsonl"

          python3 - "$RUNNER_TEMP/CODEOWNERS" "$RUNNER_TEMP/files.txt" "$RUNNER_TEMP/lanes.json" "$RUNNER_TEMP/files.jsonl" <<'PY'
          import json
          import os
          import re
          import sys

          def lane_exempt(lanes_path, files_path):
              """True only when every changed file sits inside one configured
              automation lane and the author, branch and size limits all match.
              Any doubt or error returns False, so the owner rules apply."""
              try:
                  if os.environ.get("FEEDS_PAUSED", "").strip().lower() in ("1", "true", "yes"):
                      print("Automation lanes are paused (FEEDS_PAUSED); owner rules apply.")
                      return False
                  if os.environ.get("SAME_REPO") != "true":
                      return False
                  with open(lanes_path, encoding="utf-8") as fh:
                      cfg = json.load(fh)
                  if cfg.get("enabled") is not True:
                      return False
                  author = os.environ.get("PR_AUTHOR", "").strip().lower()
                  head_ref = os.environ.get("HEAD_REF", "")
                  entries = []
                  with open(files_path, encoding="utf-8") as fh:
                      for line in fh:
                          if line.strip():
                              entries.append(json.loads(line))
                  if not entries:
                      return False
                  for lane in cfg.get("lanes", []):
                      authors = [a.strip().lower() for a in (lane.get("authors") or []) if a.strip()]
                      prefix = lane.get("branch_prefix") or ""
                      paths = lane.get("paths") or []
                      exts = [e.lower() for e in (lane.get("extensions") or [])]
                      # A lane must name an author, a branch prefix, data/ folders and file types.
                      if not authors or not prefix or not paths or not exts:
                          continue
                      # Hard limit: a lane can only ever cover folders under data/.
                      if any((not p.startswith("data/")) or (not p.endswith("/")) or ".." in p for p in paths):
                          continue
                      if author not in authors or not head_ref.startswith(prefix):
                          continue
                      max_files = int(lane.get("max_files", 0))
                      max_lines = int(lane.get("max_changed_lines", 0))
                      if max_files < 1 or max_lines < 1 or len(entries) > max_files:
                          continue
                      lines = 0
                      ok = True
                      for e in entries:
                          name = e.get("filename") or ""
                          if e.get("previous_filename"):
                              ok = False
                          if e.get("status") not in ("added", "modified"):
                              ok = False
                          if ".." in name.split("/") or not any(name.startswith(p) for p in paths):
                              ok = False
                          if not any(name.lower().endswith(x) for x in exts):
                              ok = False
                          lines += int(e.get("additions", 0)) + int(e.get("deletions", 0))
                      if ok and lines <= max_lines:
                          print(f"Automation lane '{lane.get('name', '?')}' matched {len(entries)} file(s), {lines} changed line(s): owner-only hold not applied. Required checks still apply.")
                          return True
                  return False
              except Exception as exc:  # fail closed
                  print(f"Automation lane check failed ({exc}); owner rules apply.")
                  return False

          def to_regex(pattern):
              anchored = pattern.startswith("/") or "/" in pattern.rstrip("/")
              is_dir = pattern.endswith("/")
              p = pattern.strip("/")
              out, i = "", 0
              while i < len(p):
                  if p.startswith("**", i):
                      out += ".*"
                      i += 2
                  elif p[i] == "*":
                      out += "[^/]*"
                      i += 1
                  elif p[i] == "?":
                      out += "[^/]"
                      i += 1
                  else:
                      out += re.escape(p[i])
                      i += 1
              prefix = "^" if anchored else "^(?:.*/)?"
              suffix = "/.*$" if is_dir else "(?:/.*)?$"
              return re.compile(prefix + out + suffix)

          rules = []
          with open(sys.argv[1], encoding="utf-8") as fh:
              for line in fh:
                  parts = line.split("#", 1)[0].split()
                  if len(parts) >= 2:
                      rules.append(to_regex(parts[0]))
          if not rules:
              print("::error::CODEOWNERS on main has no owner rules, so this pull request is held for the owner.")
              sys.exit(1)

          with open(sys.argv[2], encoding="utf-8") as fh:
              files = [f.strip() for f in fh if f.strip()]
          if not files:
              print("::error::Could not read the list of changed files, so this pull request is held for the owner.")
              sys.exit(1)
          if lane_exempt(sys.argv[3], sys.argv[4]):
              sys.exit(0)
          always = re.compile(r"^\.github/|(^|/)CODEOWNERS$")
          hits =sorted({f for f in files if always.search(f) or any(r.match(f) for r in rules)})
          if hits:
              print("::error::This pull request changes owner-only files and needs the owner to merge it:")
              print("\n".join(hits))
              sys.exit(1)
          print(f"Checked {len(files)} file(s) against {len(rules)} owner rule(s): none are owner-only.")
          PY

      - name: Turn on auto-merge
        if: env.SAME_REPO == 'true' && env.IS_DRAFT != 'true'
        run: gh pr merge --auto --squash "$PR_URL" || echo "::warning::Could not turn on auto-merge."

      - name: Wait for every other check to pass
        run: |
          set -euo pipefail
          sleep 60
          stable=0
          for i in $(seq 1 140); do
            runs=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" --paginate \
              --jq '.check_runs[] | select(.name != "merge-gate") | [.name, .status, (.conclusion // "")] | @tsv')
            statuses=$(gh api "repos/$REPO/commits/$HEAD_SHA/status" \
              --jq '.statuses[] | [.context, .state] | @tsv')

            failed=$( { printf '%s\n' "$runs" | awk -F'\t' '$3 ~ /^(failure|cancelled|timed_out|action_required|stale)$/ {print $1" ("$3")"}';
                        printf '%s\n' "$statuses" | awk -F'\t' '$2 ~ /^(failure|error)$/ {print $1" ("$2")"}'; } )
            pending=$( { printf '%s\n' "$runs" | awk -F'\t' 'NF && $2 != "completed" {print $1}';
                         printf '%s\n' "$statuses" | awk -F'\t' '$2 == "pending" {print $1}'; } )

            if [ -n "$failed" ]; then
              echo "::error::These checks failed:"
              printf '%s\n' "$failed"
              exit 1
            fi
            if [ -z "$pending" ]; then
              stable=$((stable + 1))
              if [ "$stable" -ge 2 ]; then
                echo "All checks passed."
                exit 0
              fi
            else
              stable=0
              echo "Waiting on: $(printf '%s ' $pending)"
            fi
            sleep 20
          done
          echo "::error::Timed out waiting for checks."
          exit 1
